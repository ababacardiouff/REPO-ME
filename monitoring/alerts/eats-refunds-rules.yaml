groups:
  - name: eats-refunds.rules
    interval: 30s
    rules:
      - alert: HighRefundFailures
        expr: rate(refund_failures_total[5m]) > 5
        for: 2m
        labels:
          severity: critical
          service: molam-eats-refunds
        annotations:
          summary: "High refund failures detected"
          description: "More than 5 refund failures/minute in the last 5 minutes for Molam Eats."

      - alert: RefundSuccessRateDrop
        expr: (1 - (sum(refund_failures_total) / sum(refund_requests_total))) < 0.9
        for: 5m
        labels:
          severity: warning
          service: molam-eats-refunds
        annotations:
          summary: "Refund success rate dropped below 90%"
          description: "Refund success rate for Molam Eats has dropped below 90% in the last 5 minutes."

      - alert: RefundLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(refund_duration_seconds_bucket[5m])) by (le)) > 2
        for: 3m
        labels:
          severity: critical
          service: molam-eats-refunds
        annotations:
          summary: "Refund latency is too high (p95 > 2s)"
          description: "95th percentile of refund processing duration exceeded 2 seconds."

      - alert: NoRefundsProcessed
        expr: increase(refund_requests_total[30m]) == 0
        for: 30m
        labels:
          severity: warning
          service: molam-eats-refunds
        annotations:
          summary: "No refunds processed in the last 30 minutes"
          description: "Refund system appears idle. Possible issue with refund workers."
