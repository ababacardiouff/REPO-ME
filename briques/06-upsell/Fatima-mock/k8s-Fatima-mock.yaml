apiVersion: apps/v1
kind: Deployment
metadata:
  name: Fatima-mock
  namespace: molam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: Fatima-mock
  template:
    metadata:
      labels:
        app: Fatima-mock
    spec:
      containers:
        - name: Fatima-mock
          image: registry.molam.com/Fatima-mock:staging
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: Fatima-mock
  namespace: molam
spec:
  selector:
    app: Fatima-mock
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
