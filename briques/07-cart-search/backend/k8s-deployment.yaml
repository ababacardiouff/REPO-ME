apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-search-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-search-backend
  template:
    metadata:
      labels:
        app: cart-search-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/molam-eats/cart-search:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eats-secrets
                  key: database_url
            - name: FATIMA_API
              value: "http://fatima.molam/api"
---
apiVersion: v1
kind: Service
metadata:
  name: cart-search-backend
spec:
  selector:
    app: cart-search-backend
  ports:
    - port: 3000
      targetPort: 3000
