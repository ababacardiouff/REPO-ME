apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-search
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: cart-search
  template:
    metadata:
      labels:
        app: cart-search
    spec:
      containers:
        - name: cart-search
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eats-secrets
                  key: database_url
            - name: FATIMA_API
              value: "http://Fatima.molam/api"
