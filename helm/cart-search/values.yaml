replicaCount: 2

image:
  repository: ghcr.io/molam-eats/cart-search
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: eats.molam.com
      paths:
        - path: /api
          pathType: Prefix
