replicaCount: 2
image:
  repository: registry.molam.com/moderation
  tag: "1.0.0"
env:
  WS_PORT: "8081"
resources:
  requests:
    cpu: "300m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"
service:
  type: ClusterIP
  port: 3001
serviceMonitor:
  enabled: true
  namespace: monitoring
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

seed:
  enabled: false
  schedule:
    text: "0 3 * * *"
    images: "30 3 * * *"
