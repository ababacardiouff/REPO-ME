{{- if .Values.seed.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: moderation-seed
spec:
  schedule: {{ .Values.seed.schedule.text | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: moderation-seed
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              command: ["npx", "ts-node", "scripts/seed_moderation.ts"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: moderation-secrets
                      key: DATABASE_URL
{{- end }}
