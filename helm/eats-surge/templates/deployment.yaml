apiVersion: apps/v1
kind: Deployment
metadata:
  name: eats-surge
  labels:
    app: eats-surge
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: eats-surge
  template:
    metadata:
      labels:
        app: eats-surge
    spec:
      serviceAccountName: eats-surge-sa
      containers:
        - name: eats-surge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9100
          envFrom:
            - secretRef:
                name: eats-surge-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
