apiVersion: v1
kind: ServiceAccount
metadata:
  name: eats-surge-sa
  labels:
    app: eats-surge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eats-surge-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eats-surge-rolebinding
subjects:
  - kind: ServiceAccount
    name: eats-surge-sa
roleRef:
  kind: Role
  name: eats-surge-role
  apiGroup: rbac.authorization.k8s.io
