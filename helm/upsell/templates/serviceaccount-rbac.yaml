apiVersion: v1
kind: ServiceAccount
metadata:
  name: upsell-sa
  namespace: {{ .Release.Namespace | default "molam" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: upsell-role
  namespace: {{ .Release.Namespace | default "molam" }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: upsell-rolebinding
  namespace: {{ .Release.Namespace | default "molam" }}
subjects:
  - kind: ServiceAccount
    name: upsell-sa
    namespace: {{ .Release.Namespace | default "molam" }}
roleRef:
  kind: Role
  name: upsell-role
  apiGroup: rbac.authorization.k8s.io
