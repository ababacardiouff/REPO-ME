apiVersion: batch/v1
kind: CronJob
metadata:
  name: eats-order-metrics
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: order-metrics-job
              image: molam/eats-worker:latest
              command: ["node", "jobs/collectMetrics.js"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: eats-secrets
                      key: DATABASE_URL
                - name: PROM_PUSHGATEWAY
                  value: "http://prometheus-pushgateway:9091"
          restartPolicy: OnFailure
---
