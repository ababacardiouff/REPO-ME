apiVersion: batch/v1
kind: CronJob
metadata:
  name: eats-seed-cronjob
  namespace: molam-eats
spec:
  schedule: "0 6 * * 1"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: eats-seeder
              image: registry.molam.com/molam-eats-seed:latest
              command: ["node", "scripts/mass_seed_parallel.js"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: eats-db-secret
                      key: DATABASE_URL
                - name: SEED_COUNT
                  value: "50000"
                - name: RESET_DB
                  value: "true"
