apiVersion: apps/v1
kind: Deployment
metadata:
  name: eats-profile
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eats-profile
  template:
    metadata:
      labels:
        app: eats-profile
    spec:
      containers:
        - name: eats-profile
          image: eats-profile:latest
          ports:
            - containerPort: 3000
