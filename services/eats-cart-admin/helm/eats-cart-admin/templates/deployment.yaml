apiVersion: apps/v1
kind: Deployment
metadata:
  name: eats-cart-admin
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: eats-cart-admin
  template:
    metadata:
      labels:
        app: eats-cart-admin
    spec:
      containers:
        - name: eats-cart-admin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eats-secrets
                  key: DATABASE_URL
            - name: MOLAM_ID_JWKS
              value: "{{ .Values.molamId.jwks }}"
            - name: KAFKA_BROKERS
              value: "{{ .Values.kafka.brokers }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
