name: Invoice CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: molam
          POSTGRES_PASSWORD: password
          POSTGRES_DB: molam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U molam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm ci
      - run: npm run build
      - run: psql $DATABASE_URL -f migrations/012_create_invoices.sql
        env:
          DATABASE_URL: postgresql://molam:password@localhost:5432/molam
      - run: npm test
