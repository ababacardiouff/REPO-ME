name: Eats Onboarding CI

on:
  push:
    paths:
      - "src/**"
      - "migrations/**"
      - "tests/**"
      - "package.json"
      - "tsconfig.json"
      - "jest.config.js"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: molam
          POSTGRES_DB: molam
        ports:
          - 5432:5432
      zookeeper:
        image: confluentinc/cp-zookeeper:7.0.1
        ports:
          - 2181:2181
      kafka:
        image: confluentinc/cp-kafka:7.0.1
        env:
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install deps
        run: npm install
      - name: Build
        run: npm run build
      - name: Run tests
        env:
          DATABASE_URL: postgres://molam:password@localhost:5432/molam
          KAFKA_BROKERS: localhost:9092
        run: npm test
