name: HPA Scaling Test with Metrics

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  hpa-scaling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 load test & export to Prometheus
        run: |
          K6_PROMETHEUS_RW_SERVER_URL=${{ secrets.PROMETHEUS_RW_URL }} \
          K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true \
          k6 run tests/load/hpa-scaling-test.js \
            -e EATS_PLANS_URL=${{ secrets.EATS_PLANS_URL }} \
            -e TENANT=eats

      - name: Verify scaling
        run: |
          kubectl get hpa eats-plans-hpa -n molam-eats
          kubectl get pods -n molam-eats -l app=eats-plans-service
