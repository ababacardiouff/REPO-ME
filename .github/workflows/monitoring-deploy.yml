name: Deploy Monitoring (Eats Refunds)

on:
  push:
    branches:
      - main
    paths:
      - "monitoring/alerts/**"
      - "monitoring/dashboards/**"
      - ".github/workflows/monitoring-deploy.yml"

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Kubernetes
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.13.0"

      - name: Authenticate to cluster
        run: |
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > $HOME/.kube/config

      - name: Deploy Prometheus Alert Rules
        run: |
          kubectl apply -f monitoring/alerts/eats-refunds-rules.yaml -n monitoring

      - name: Deploy Grafana Dashboards
        run: |
          kubectl create configmap eats-refunds-dashboard \
            --from-file=monitoring/dashboards/eats-refunds-dashboard.json \
            -o yaml --dry-run=client | kubectl apply -f - -n monitoring

      - name: Restart Monitoring Pods (Optional)
        run: |
          kubectl rollout restart deploy prometheus -n monitoring || true
          kubectl rollout restart deploy grafana -n monitoring || true

      - name: Notify Success
        run: echo "✅ Monitoring (alerts + dashboard) deployed successfully!"
