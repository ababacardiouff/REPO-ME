name: Eats Plans CI

on:
  push:
    paths: [ "src/**", "migrations/**", "tests/**" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: molam
          POSTGRES_DB: molam
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Run migrations
        run: |
          psql postgresql://molam:password@localhost:5432/molam -f migrations/002_eats_plans_and_subscriptions.sql
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
