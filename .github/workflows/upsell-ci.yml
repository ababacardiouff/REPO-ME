name: Upsell CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test -- tests/unit/upsell.service.test.ts
