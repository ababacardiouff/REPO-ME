name: Eats Checkout CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npx jest eats/checkout/backend/tests/checkout.unit.test.ts

      - name: Run E2E Tests (Playwright)
        run: npx playwright test tests/e2e/checkout.e2e.test.ts
