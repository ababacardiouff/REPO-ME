groups:
  - name: molam-eats-chaos
    rules:
      - alert: CheckoutErrorSpike
        expr: rate(http_requests_total{job="eats-checkout",status=~"5.."}[1m]) > 0.01
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Checkout 5xx errors >1%"

      - alert: CheckoutLatencySpike
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="eats-checkout"}[5m])) by (le)) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Checkout p95 latency >1s"

      - alert: MolamPayDown
        expr: up{job="molam-pay"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Molam Pay integration down"
